name: ejary_cash
description: "A new Flutter project."

version: 1.9.3+13
environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker:
  cached_network_image:
  path:
  url_launcher: ^6.3.0
  get:
  google_fonts:
  flutter_launcher_icons:
  flutter_otp_text_field:
  intl:
  screen_go:
  flutter_file_downloader:
  change_app_package_name: ^1.4.0
  jiffy:
  device_preview:
  http:
  jwt_decoder:
  flutter_offline: ^3.0.1
  shared_preferences:
  dartz:
  dotted_border:
  firebase_core: ^2.24.2
  firebase_messaging: 
  

  flutter_html: ^3.0.0-beta.2
  timeago: ^3.7.0
  mime: ^2.0.0
  share_plus: ^10.1.1

  #geocoding:
 # geolocator: ^ 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/appLogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "lib/images/appLogo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "lib/images/appLogo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "lib/images/appLogo.png"

flutter:
  uses-material-design: true

  assets:
     - lib/images/


  # fonts:
