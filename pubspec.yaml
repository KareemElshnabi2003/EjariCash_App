name: ejary_cash
description: "Ejari Cash Mobile Application"

version: 1.9.3+13
environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker:
  cached_network_image:
  path:
  url_launcher: ^6.3.0
  get:
  google_fonts:
  flutter_otp_text_field:
  intl:
  screen_go:
  http:
  flutter_offline: ^6.0.0
  shared_preferences:
  dartz:
  dotted_border:
  firebase_core: ^4.13.0
  firebase_messaging:
  flutter_html: ^3.0.0-beta.2
  timeago: ^3.7.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons:
  change_app_package_name: ^1.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/appLogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - lib/images/

flutter_intl:
  enabled: true
